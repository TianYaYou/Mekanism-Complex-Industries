pluginManagement {
    repositories {
        mavenLocal()
        maven {
            name = 'BMCLAPI'
            url = 'https://bmclapi2.bangbang93.com/maven/'
        }
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'mekanism-complex-industries'
